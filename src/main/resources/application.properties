spring.application.name=dbasset-backend

# Conexión LOCAL a PostgreSQL (base: dbasset, schema: dbasset)
spring.datasource.url=jdbc:postgresql://localhost:5432/dbasset?currentSchema=dbasset
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Migración RFID (idempotente y solo aditiva) al arrancar. Desactivar con SPRING_SQL_INIT_MODE=never
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migracion_rfid.sql,classpath:db/migracion_superadmin.sql

# Carpeta del servidor (On-Premise) donde se guardan fotos y adjuntos de bajas
dbasset.archivos.dir=${DBASSET_ARCHIVOS_DIR:archivos}

spring.security.user.name=admin
spring.security.user.password=12345